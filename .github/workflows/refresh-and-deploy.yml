name: Refresh data and deploy site
on:
  schedule:
    - cron: "0 7 2 * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Refresh registry data (non-fatal)
        continue-on-error: true
        run: |
          set -o pipefail
          python pipelines/mainstreet.py 2>&1 | tee data/last_refresh.log
      - name: Build site
        run: python site/build.py --base-url "${{ vars.BASE_URL || 'https://boomertowns.com' }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - name: Commit refreshed dataset
        run: |
          git config user.name "bt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/last_refresh.log 2>/dev/null || true
          git add -f data/mainstreet_cities.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: registry refresh [skip ci]"
          git push || true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
